- name: Vérifier que le site répond
  hosts: web
  gather_facts: true
  tasks:
    - name: Interroger la page d'accueil depuis le serveur
      ansible.builtin.uri:
        url: "http://{{ ansible_default_ipv4.address }}:{{ nginx_port }}/"
        return_content: true
      register: page
    - name: Vérifier le contenu
      ansible.builtin.assert:
        that: "'Serveur' in page.content"
        fail_msg: "La page ne contient pas le texte attendu"