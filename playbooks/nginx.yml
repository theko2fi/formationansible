---
- name: Déployer le site nginx
  hosts: web
  become: true
  tasks:
  - name: Installer nginx
    ansible.builtin.apt:
      name: nginx
      state: present
      update_cache: true
  - name: Créer le dossier du site
    ansible.builtin.file:
      path: "/var/www/{{ site_name }}"
      state: directory
      mode: "0755"
  - name: Déployer la page d'accueil
    ansible.builtin.template:
      src: "./templates/index.html.j2"
      dest: "/var/www/{{ site_name }}/index.html"
      mode: "0644"
  - name: Déployer la configuration du site
    ansible.builtin.template:
      src: site.conf.j2
      dest: "/etc/nginx/conf.d/{{ site_name }}.conf"
      mode: "0644"
    notify: Recharger nginx
  - name: Démarrer et activer nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: true
  handlers:
    - name: Recharger nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded